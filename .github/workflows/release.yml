name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Run regression tests
        run: ./Tests/run.sh

      - name: Build universal app
        env:
          ARCHS: arm64 x86_64
        run: ./build.sh

      - name: Package release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          codesign --verify --deep --strict build/TopPin.app
          lipo -archs build/TopPin.app/Contents/MacOS/TopPin
          mkdir -p build/release-stage build/releases
          ditto build/TopPin.app build/release-stage/TopPin.app
          cp LICENSE README.md README_EN.md build/release-stage/
          ditto -c -k --sequesterRsrc build/release-stage "build/releases/TopPin-${RELEASE_TAG}-macos-universal.zip"
          cd build/releases
          shasum -a256 "TopPin-${RELEASE_TAG}-macos-universal.zip" > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "build/releases/TopPin-${RELEASE_TAG}-macos-universal.zip" \
            build/releases/SHA256SUMS \
            --verify-tag --notes-from-tag --title "TopPin ${RELEASE_TAG}"
